<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KeystrokeID — биометрическая аутентификация по клавиатурному почерку</title>
    <meta name="description" content="Система биометрической аутентификации на основе клавиатурного почерка." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'system-ui', 'sans-serif'],
              display: ['"Space Grotesk"', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            colors: {
              ink: {
                50:  '#f6f8fc',
                100: '#eef2fa',
                200: '#dde4f1',
                300: '#c4cee0',
                400: '#707f9e',
                500: '#5a6a8a',
                600: '#475370',
                700: '#2f3855',
                800: '#1d2540',
                900: '#0f1628',
              },
              brand: {
                50:  '#eef4ff',
                100: '#dde9ff',
                200: '#bcd4ff',
                300: '#8eb4ff',
                400: '#5b8bff',
                500: '#3266ff',
                600: '#1f4ae0',
                700: '#1a3bb0',
                800: '#152d85',
                900: '#0f205c',
              },
              accent: {
                50:  '#ecfeff',
                100: '#cffafe',
                200: '#a5f3fc',
                300: '#67e8f9',
                400: '#22d3ee',
                500: '#06b6d4',

              },
              success: {
                500: '#10b981',
                600: '#059669',
              },
              danger: {
                500: '#ef4444',
                600: '#dc2626',
              },
              warning: {
                500: '#f59e0b',
                600: '#d97706',
              },
            },
            boxShadow: {
              glass: '0 1px 0 0 rgba(255,255,255,0.6) inset, 0 8px 28px -10px rgba(31,74,224,0.18)',
              glow: '0 0 0 4px rgba(50,102,255,0.12), 0 12px 32px -8px rgba(50,102,255,0.35)',
              soft: '0 1px 2px rgba(15,22,40,0.04), 0 8px 24px -12px rgba(15,22,40,0.10)',
            },
            backgroundImage: {
              'grid-soft':
                'linear-gradient(to right, rgba(31,74,224,0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(31,74,224,0.06) 1px, transparent 1px)',
              'aurora':
                'radial-gradient(60% 50% at 15% 10%, rgba(50,102,255,0.18) 0%, transparent 60%), radial-gradient(50% 40% at 90% 20%, rgba(34,211,238,0.18) 0%, transparent 60%), radial-gradient(50% 50% at 80% 90%, rgba(99,102,241,0.12) 0%, transparent 60%)',
            },
            keyframes: {
              'pulse-ring': {
                '0%':   { transform: 'scale(0.9)', opacity: '0.6' },
                '70%':  { transform: 'scale(1.6)', opacity: '0' },
                '100%': { transform: 'scale(1.6)', opacity: '0' },
              },
              'scan': {
                '0%':   { transform: 'translateY(-100%)' },
                '100%': { transform: 'translateY(2200%)' },
              },
              'shimmer': {
                '0%':   { backgroundPosition: '-200% 0' },
                '100%': { backgroundPosition: '200% 0' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%':      { transform: 'translateY(-6px)' },
              },
            },
            animation: {
              'pulse-ring': 'pulse-ring 1.6s cubic-bezier(0.215, 0.61, 0.355, 1) infinite',
              'scan': 'scan 2.4s linear infinite',
              'shimmer': 'shimmer 2.6s linear infinite',
              'float': 'float 4s ease-in-out infinite',
            },
          }
        }
      };
    </script>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, sans-serif;
        color: var(--color-text, #0f1628);
        background: var(--bg-body);
        background-attachment: fixed;
        min-height: 100vh;
        transition: background 0.4s ease, color 0.4s ease;
      }

      /* ── Light theme (default) ── */
      :root {
        --bg-body:
          radial-gradient(60% 50% at 15% 10%, rgba(50,102,255,0.16) 0%, transparent 60%),
          radial-gradient(50% 40% at 90% 20%, rgba(34,211,238,0.16) 0%, transparent 60%),
          radial-gradient(50% 50% at 80% 90%, rgba(99,102,241,0.10) 0%, transparent 60%),
          linear-gradient(180deg, #f6f8fc 0%, #eef2fa 100%);
        --color-text: #0f1628;
        --glass-bg: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.70) 100%);
        --glass-strong-bg: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.78) 100%);
        --glass-soft-bg: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.4) 100%);
        --glass-border: rgba(255,255,255,0.65);
        --glass-shadow-inset: rgba(255,255,255,0.65);
        --glass-shadow-outer: rgba(31,74,224,0.18);
        --header-bg: rgba(255,255,255,0.55);
        --footer-bg: rgba(255,255,255,0.40);
        --input-bg: rgba(255,255,255,0.85);
        --card-bg-subtle: rgba(255,255,255,0.55);
        --border-subtle: rgba(255,255,255,0.60);
        --border-subtle-2: rgba(255,255,255,0.70);
        --scrollbar-thumb: rgba(31,74,224,0.18);
        --scrollbar-hover: rgba(31,74,224,0.32);
        --selection-bg: rgba(50,102,255,0.18);
        --grid-line: rgba(31,74,224,0.06);
        --scan-color: rgba(50,102,255,0.55);
        --gradient-ring-1: rgba(50,102,255,0.6);
        --gradient-ring-2: rgba(34,211,238,0.6);
        --gradient-ring-3: rgba(99,102,241,0.6);
      }

      /* ── Dark theme ── */
      html.dark {
        --bg-body:
          radial-gradient(60% 50% at 15% 10%, rgba(50,102,255,0.10) 0%, transparent 60%),
          radial-gradient(50% 40% at 90% 20%, rgba(34,211,238,0.08) 0%, transparent 60%),
          radial-gradient(50% 50% at 80% 90%, rgba(99,102,241,0.06) 0%, transparent 60%),
          linear-gradient(180deg, #171c2e 0%, #10141f 100%);
        --color-text: #d8dde8;
        --glass-bg: linear-gradient(180deg, rgba(30,36,56,0.82) 0%, rgba(24,28,44,0.72) 100%);
        --glass-strong-bg: linear-gradient(180deg, rgba(34,40,62,0.90) 0%, rgba(28,34,52,0.82) 100%);
        --glass-soft-bg: linear-gradient(180deg, rgba(30,36,56,0.50) 0%, rgba(24,28,44,0.35) 100%);
        --glass-border: rgba(60,70,100,0.45);
        --glass-shadow-inset: rgba(60,70,100,0.25);
        --glass-shadow-outer: rgba(0,0,0,0.35);
        --header-bg: rgba(20,24,40,0.70);
        --footer-bg: rgba(18,22,36,0.60);
        --input-bg: rgba(30,36,56,0.80);
        --card-bg-subtle: rgba(30,36,56,0.50);
        --border-subtle: rgba(60,70,100,0.40);
        --border-subtle-2: rgba(60,70,100,0.50);
        --scrollbar-thumb: rgba(80,100,160,0.35);
        --scrollbar-hover: rgba(80,100,160,0.55);
        --selection-bg: rgba(50,102,255,0.30);
        --grid-line: rgba(80,100,160,0.10);
        --scan-color: rgba(80,130,255,0.45);
        --gradient-ring-1: rgba(60,120,255,0.5);
        --gradient-ring-2: rgba(44,220,248,0.5);
        --gradient-ring-3: rgba(110,112,251,0.5);
      }

      /* Smooth transition for all themed elements */
      html.dark *, html * {
        transition: background-color 0.35s ease, border-color 0.35s ease, color 0.35s ease, box-shadow 0.35s ease;
      }

      /* Glass card */
      .glass {
        background: var(--glass-bg);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid var(--glass-border);
        box-shadow:
          inset 0 1px 0 var(--glass-shadow-inset),
          0 1px 2px rgba(15,22,40,0.04),
          0 18px 40px -16px var(--glass-shadow-outer);
        border-radius: 20px;
      }
      .glass-strong {
        background: var(--glass-strong-bg);
      }
      .glass-soft {
        background: var(--glass-soft-bg);
      }

      /* Subtle grid background for hero areas */
      .grid-bg {
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%);
      }

      /* Animated gradient border */
      .gradient-ring {
        position: relative;
      }
      .gradient-ring::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, var(--gradient-ring-1), var(--gradient-ring-2), var(--gradient-ring-3));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }

      /* Scan line for hero */
      .scanline::after {
        content: '';
        position: absolute;
        left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg, transparent, var(--scan-color), transparent);
        animation: scan 2.4s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(0); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(220px); opacity: 0; }
      }

      /* Mono numbers */
      .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

      /* Custom focus */
      .focus-ring:focus { outline: none; box-shadow: 0 0 0 4px rgba(50,102,255,0.15), 0 0 0 1px #3266ff; }

      /* Skip-to-content link — visible only when focused via keyboard */
      .skip-link {
        position: fixed;
        top: 0; left: 50%;
        transform: translate(-50%, -120%);
        z-index: 100;
        padding: 10px 18px;
        border-radius: 0 0 12px 12px;
        background: #1f4ae0;
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        box-shadow: 0 8px 24px -8px rgba(31,74,224,0.5);
        transition: transform 0.2s ease;
      }
      .skip-link:focus {
        outline: none;
        transform: translate(-50%, 0);
      }

      /* Respect users who prefer reduced motion (WCAG 2.3.3 / 2.2.2) */
      @media (prefers-reduced-motion: reduce) {
        html.dark *, html * {
          animation-duration: 0.001ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.001ms !important;
          scroll-behavior: auto !important;
        }
        .scanline::after { animation: none !important; display: none; }
      }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-hover); }

      /* Selection */
      ::selection { background: var(--selection-bg); }

      /* Dark theme text overrides (contrast-tuned for WCAG AA on dark cards) */
      html.dark .text-ink-900 { color: #e6eaf2 !important; }
      html.dark .text-ink-800 { color: #cdd5e6 !important; }
      html.dark .text-ink-700 { color: #aebbd6 !important; }
      html.dark .text-ink-600 { color: #9aa8c4 !important; }
      html.dark .text-ink-500 { color: #8c9bbb !important; }
      html.dark .text-ink-400 { color: #8593b2 !important; }

      /* Dark theme background overrides */
      html.dark .bg-white\/60,
      html.dark .bg-white\/70,
      html.dark .bg-white\/80,
      html.dark .bg-white\/55,
      html.dark .bg-white\/40,
      html.dark .bg-white\/85 {
        background-color: var(--card-bg-subtle) !important;
      }

      html.dark .border-white\/60,
      html.dark .border-white\/70 {
        border-color: var(--border-subtle) !important;
      }

      html.dark .bg-amber-50\/80 {
        background-color: rgba(40,35,20,0.80) !important;
      }
      html.dark .border-amber-200 {
        border-color: rgba(120,100,40,0.50) !important;
      }
      html.dark .text-amber-800 {
        color: #e8c860 !important;
      }

      html.dark .bg-brand-50 {
        background-color: rgba(50,102,255,0.12) !important;
      }
      html.dark .border-brand-100 {
        border-color: rgba(50,102,255,0.25) !important;
      }
      html.dark .bg-emerald-50 {
        background-color: rgba(16,185,129,0.12) !important;
      }
      html.dark .border-emerald-100 {
        border-color: rgba(16,185,129,0.25) !important;
      }
      html.dark .bg-rose-50 {
        background-color: rgba(239,68,68,0.12) !important;
      }
      html.dark .border-rose-100 {
        border-color: rgba(239,68,68,0.25) !important;
      }
      html.dark .bg-ink-200\/60 {
        background-color: rgba(60,70,100,0.40) !important;
      }

      /* Dark theme: accent / icon text colors lifted for readability on dark surfaces */
      html.dark .text-brand-600  { color: #5b8bff !important; }
      html.dark .text-brand-700  { color: #8eb4ff !important; }
      html.dark .text-accent-600 { color: #22d3ee !important; }
      html.dark .text-emerald-600,
      html.dark .text-emerald-700 { color: #34d399 !important; }
      html.dark .text-rose-600,
      html.dark .text-rose-700    { color: #fb7185 !important; }
      html.dark .text-amber-600,
      html.dark .text-amber-700   { color: #fbbf24 !important; }

      /* Dark theme: warning pill gets a dark tint like the other pills */
      html.dark .bg-amber-50 { background-color: rgba(245,158,11,0.14) !important; }

      /* Dark theme: hover states that would flip to solid white keep a dark surface
         (otherwise light button text becomes invisible on a white hover background) */
      html.dark .hover\:bg-white:hover     { background-color: rgba(48,57,84,0.92) !important; }
      html.dark .hover\:bg-white\/60:hover { background-color: rgba(48,57,84,0.70) !important; }
      html.dark .hover\:bg-white\/40:hover { background-color: rgba(48,57,84,0.55) !important; }
      html.dark .hover\:bg-rose-100:hover  { background-color: rgba(239,68,68,0.22) !important; }
      html.dark .hover\:bg-brand-50:hover  { background-color: rgba(50,102,255,0.18) !important; }

      /* Dark textarea/input */
      html.dark textarea,
      html.dark input {
        background-color: var(--input-bg) !important;
        border-color: var(--border-subtle-2) !important;
        color: var(--color-text) !important;
      }
      html.dark textarea::placeholder,
      html.dark input::placeholder {
        color: #8593b2 !important;
      }
    </style>
