            },

              },

            },
            boxShadow: {
              glass: '0 1px 0 0 rgba(255,255,255,0.6) inset, 0 8px 28px -10px rgba(31,74,224,0.18)',
              glow: '0 0 0 4px rgba(50,102,255,0.12), 0 12px 32px -8px rgba(50,102,255,0.35)',
              soft: '0 1px 2px rgba(15,22,40,0.04), 0 8px 24px -12px rgba(15,22,40,0.10)',
            },
            backgroundImage: {
              'grid-soft':
                'linear-gradient(to right, rgba(31,74,224,0.06) 1px, transparent 1px), linear-gradient(to bottom, rgba(31,74,224,0.06) 1px, transparent 1px)',
              'aurora':
                'radial-gradient(60% 50% at 15% 10%, rgba(50,102,255,0.18) 0%, transparent 60%), radial-gradient(50% 40% at 90% 20%, rgba(34,211,238,0.18) 0%, transparent 60%), radial-gradient(50% 50% at 80% 90%, rgba(99,102,241,0.12) 0%, transparent 60%)',
            },
            keyframes: {
              'pulse-ring': {
                '0%':   { transform: 'scale(0.9)', opacity: '0.6' },
                '70%':  { transform: 'scale(1.6)', opacity: '0' },

    <style>
      html, body {
        margin: 0;
        padding: 0;
        font-family: 'Inter', system-ui, sans-serif;
        color: #0f1628;
        background:
          radial-gradient(60% 50% at 15% 10%, rgba(50,102,255,0.16) 0%, transparent 60%),
          radial-gradient(50% 40% at 90% 20%, rgba(34,211,238,0.16) 0%, transparent 60%),
          radial-gradient(50% 50% at 80% 90%, rgba(99,102,241,0.10) 0%, transparent 60%),
          linear-gradient(180deg, #f6f8fc 0%, #eef2fa 100%);
        background-attachment: fixed;
        min-height: 100vh;
      }

      /* Glass card */
      .glass {
        background: linear-gradient(180deg, rgba(255,255,255,0.85) 0%, rgba(255,255,255,0.70) 100%);
        backdrop-filter: blur(14px) saturate(140%);
        -webkit-backdrop-filter: blur(14px) saturate(140%);
        border: 1px solid rgba(255,255,255,0.65);
        box-shadow:
          inset 0 1px 0 rgba(255,255,255,0.65),
          0 1px 2px rgba(15,22,40,0.04),
          0 18px 40px -16px rgba(31,74,224,0.18);
        border-radius: 20px;
      }
      .glass-strong {
        background: linear-gradient(180deg, rgba(255,255,255,0.92) 0%, rgba(255,255,255,0.78) 100%);
      }
      .glass-soft {
        background: linear-gradient(180deg, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.4) 100%);
      }

      /* Subtle grid background for hero areas */
      .grid-bg {
        background-image:
          linear-gradient(to right, rgba(31,74,224,0.06) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(31,74,224,0.06) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 70% 60% at 50% 30%, #000 30%, transparent 80%);
      }

      /* Animated gradient border */
      .gradient-ring {
        position: relative;
      }
      .gradient-ring::before {
        content: '';
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        padding: 1px;
        background: linear-gradient(135deg, rgba(50,102,255,0.6), rgba(34,211,238,0.6), rgba(99,102,241,0.6));
        -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
        -webkit-mask-composite: xor;
                mask-composite: exclude;
        pointer-events: none;
      }

      /* Scan line for hero */
      .scanline::after {
        content: '';
        position: absolute;
        left: 0; right: 0; top: 0; height: 2px;
        background: linear-gradient(90deg, transparent, rgba(50,102,255,0.55), transparent);
        animation: scan 2.4s linear infinite;
      }
      @keyframes scan {
        0%   { transform: translateY(0); opacity: 0; }
        10%  { opacity: 1; }
        90%  { opacity: 1; }
        100% { transform: translateY(220px); opacity: 0; }
      }

      /* Mono numbers */
      .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }

      /* Custom focus */
      .focus-ring:focus { outline: none; box-shadow: 0 0 0 4px rgba(50,102,255,0.15), 0 0 0 1px #3266ff; }

      /* Scrollbar */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-thumb { background: rgba(31,74,224,0.18); border-radius: 999px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(31,74,224,0.32); }

      /* Selection */
      ::selection { background: rgba(50,102,255,0.18); }
    </style>
